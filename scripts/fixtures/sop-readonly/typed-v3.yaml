      <label>Note<input data-field="note"></label><input type="number" data-field="count"><input type="checkbox" data-field="ok"><select multiple data-field="tags"><option value="a">A</option><option value="b">B</option></select><script>window.untrustedScriptRan=true</script><button onclick="parent.document.body.innerHTML=1">untrusted</button>
