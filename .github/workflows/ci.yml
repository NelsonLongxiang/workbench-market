      - name: 「谁能做什么」页单测（纯函数——授予的状态、范围、期限，待核准，按人排的表，矩阵格子；单列一步）
        run: node scripts/access-ui-unit.mjs
      - name: 「团队」页单测（纯函数——团队状态、负责人、成员归谁用、计数、空和读不到的说法、建部门校验；单列一步）
        run: node scripts/team-ui-unit.mjs
      - name: 身份服务连不上单测（纯函数——认法只认 502 加这个代号·退避重试·连上后清状态并重读·全景的总结句；单列一步）
        run: node scripts/identity-status-unit.mjs
      - name: 事项列表单测（纯函数——分组、行文、视角、名字；单列一步）
        run: node scripts/work-items-ui-unit.mjs
      - name: 驾驶舱骨架单测（纯函数——三栏尺寸、放大还原、数据视图引用、页签；单列一步）
        run: node scripts/cockpit-frame-unit.mjs
      - name: 凭据库（融合 dsh-vault：读写要口令·业务面 403·摘要无明文·坏 JSON 不进日志·写锁/重开/闲置上锁/限流）
        run: node scripts/vault-concurrency-test.mjs && node scripts/vault-smoke.mjs
      - name: 条目自带答复入口单测（纯函数——answer_via 的地址、请求体、填写项；核准卡片的写法；单列一步）
        run: node scripts/answer-via-unit.mjs
      - name: F5 env-face 判定回归（不启动 Docker）
        run: node scripts/security-env-face-test.mjs
      - name: 扩展挂载点冒烟（WM_EXTENSIONS_DIR：不设不加载·目录/模块/register 出错拒绝启动·路由/待办来源/业务写面）
        run: node scripts/extensions-smoke.mjs
      - name: 扩展的路由报动作（ctx.routes.add：动作名、路径命名空间、方法与类别、谁能调；直接挂的点名计数，enforce 拒绝启动；快照 --extensions 单列、不写 surfaces/）
        run: node scripts/extension-routes-smoke.mjs
      - name: Odoo 弹窗登录链接单测（return 换成当前页·只回 path）
        run: node scripts/odoo-login-href-unit.mjs
      - name: Odoo 浏览器登录地址策略（WM_ODOO_BROWSER_URL）
        run: node scripts/odoo-browser-origin-test.mjs
      - name: 来源 IP 单测（WM_TRUSTED_PROXIES：可信反代才认 X-Real-IP/XFF·伪造不生效·非法项拒绝启动）
        run: node scripts/client-ip-unit.mjs
      - name: 日志不泄露上游会话 + 登录中继安全头（Set-Cookie 只记名·查询串不进日志·XFO/nosniff/frame-ancestors）
        # 这一步只核响应头和日志。Chromium 嵌框那几条在 browser-security 里用钉住版本的 Chromium 跑（PLAYWRIGHT_VERSION）；
        # 这里清掉 runner 镜像自带的 CHROME_BIN（系统 Google Chrome，版本随镜像漂：镜像 20261111 升到 157，被拦的子框不再出现在主框架树里）
        run: CHROME_BIN= node scripts/log-secret-relay-headers-smoke.mjs
      - name: 管理员口令止血单测（#292 M4：pagehide 抹口令·变更广播）
        run: node scripts/admin-token-guard-unit.mjs
      - name: 门户剥 Service-Worker-Allowed 冒烟（#292 M5）
        run: node scripts/portal-sw-header-smoke.mjs
      - name: 门户台地址带路径的跳转映射冒烟（base 外跳转拦成 502、base 内去 base）
        run: node scripts/portal-base-redirect-smoke.mjs
      - name: 控制面冒烟（#292 M1：浏览器管理写只认控制面·本机 CLI 保留·反代按远程·控制面围栏）
        run: node scripts/control-surface-smoke.mjs
      - name: 远程写总门大小写一致性（/API/… 不能绕过口令）
        run: node scripts/api-gate-case-smoke.mjs
      - name: 安全对抗例组（PASS / SKIP / NEEDS-MATERIAL 分列）
        run: node scripts/security-adversarial-smoke.mjs
      # 上传走的是平台的产物接口：它出故障（比如返回网页而不是 JSON）不代表测试失败。
      # 作业结论以测试步骤为准；上传失败时证据不丢——原样打进日志、等一会儿补传一次，并在作业摘要里单独标出「证据没传上去」。
      - name: 留存 F5 原始证据与覆盖摘要
        id: f5_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: f5-security-evidence
          path: |
            tmp/security-adversarial-summary.json
            tmp/f5-env-face-*.json
          if-no-files-found: warn
      - name: 证据没传上去：原样留在日志里，等一分钟后补传
        if: always() && steps.f5_evidence.outcome == 'failure'
        run: |
          echo "::warning title=证据没传上去::F5 原始证据上传失败（平台的产物接口出错，不影响测试结论）。证据原文在本步日志里；下一步补传一次。"
          {
            echo "### ⚠ F5 原始证据没传上去"
            echo "上传失败不影响测试结论（以测试步骤为准）。证据原文在「证据没传上去」这一步的日志里；补传的结果见下一步。"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in tmp/security-adversarial-summary.json tmp/f5-env-face-*.json; do
            [ -f "$f" ] || continue
            echo "::group::$f（$(wc -c < "$f") 字节，sha256 $(sha256sum "$f" | cut -d' ' -f1)）"
            cat "$f"; echo
            echo "::endgroup::"
          done
          sleep 60
      - name: 补传 F5 原始证据
        id: f5_evidence_retry
        if: always() && steps.f5_evidence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: f5-security-evidence
          overwrite: true # 第一次可能传了一半、名字已被占
          path: |
            tmp/security-adversarial-summary.json
            tmp/f5-env-face-*.json
          if-no-files-found: warn
      - name: 补传的结果
        if: always() && steps.f5_evidence.outcome == 'failure'
        env:
          RETRY: ${{ steps.f5_evidence_retry.outcome }}
        run: |
          if [ "$RETRY" = "success" ]; then
            echo "补传成功：产物 f5-security-evidence。" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=证据补传也失败::产物没有传上去；证据原文在「证据没传上去」那一步的日志里，可以从那里取回。"
            echo "补传也失败：证据原文在「证据没传上去」那一步的日志里（带字节数和 sha256，可以核对）。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: server 冷启动探针（防重启即死）
        run: |
          PORT=19999 DATA_DIR=${{ runner.temp }}/ci-data ADMIN_TOKEN=ci timeout 20 node --disable-warning=ExperimentalWarning server/src/index.ts &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:19999/api/health >/dev/null && echo "health ok" && exit 0
            sleep 1
          done
          echo "server failed to boot" >&2; exit 1
  # 契约联调：上游 a2a-net 的 superagent 宿主当对端（宿主自己从 process face 签发确认、进展、提问、结果回执），市场在回环上收。
  # 改入站（回执、进展、跟进、验签）的 PR 都要过它。上游钉 next/0.8 的 f458294（#610 合并提交：preview.13 之上修掉了对 bots.a2a 里远端成员误发 superagent-member）。
  upstream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: NelsonLongxiang/dsh-open-a2a-net
          ref: f458294bd6352be7a90c4d20b1fb84c6e1843dbb
          path: dsh-open-a2a-net-contract
      - name: 上游依赖与构建（缓存键带钉住的提交）
        uses: actions/cache@v4
        with:
          path: |
            dsh-open-a2a-net-contract/node_modules
            dsh-open-a2a-net-contract/lib
          key: upstream-contract-f458294bd6352be7a90c4d20b1fb84c6e1843dbb-${{ hashFiles('dsh-open-a2a-net-contract/pnpm-lock.yaml') }}
      - name: 装上游依赖并构建
        working-directory: dsh-open-a2a-net-contract
        run: |
          [ -d node_modules ] || pnpm install --frozen-lockfile --ignore-scripts
          [ -d lib ] || pnpm run build
      - name: 契约联调：市场 × superagent 宿主（确认、进展、提问、答复轻路径、结果、abandoned；只听回环、临时目录、合成数据）
        env:
          A2A_UPSTREAM_DIR: ${{ github.workspace }}/dsh-open-a2a-net-contract
        run: node scripts/contract-upstream-test.mjs
