name: CI
on:
  pull_request:
    branches: [main]
jobs:
  odoo-operator-synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic Odoo operator guards (no credentials or network)
        shell: pwsh
        run: ./scripts/ops/odoo-readonly-preflight-test.ps1
  browser-security:
    # #292 M4 真实浏览器反例：有口令不嵌 /go/、跳出清口令、登录弹窗不复制口令且无 opener（bfcache 未命中记 SKIP）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Playwright（Python）+ Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: pnpm --filter web build
      - name: Odoo same-host login and logout (synthetic HTTP and Chromium)
        run: |
          export CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          node scripts/odoo-same-host-login-smoke.mjs
          node scripts/odoo-browser-origin-http-test.mjs
          node scripts/odoo-logout-smoke.mjs
          node scripts/log-secret-relay-headers-smoke.mjs
      - name: SOP metadata-only history UI (#309, synthetic intercepted API)
        env:
          PYTHON: python
        run: node scripts/sop-list-privacy-browser.mjs
      - name: Review task action and human approval UI (synthetic intercepted API)
        run: python scripts/review-gate-browser.py
      - name: Tasks viewer identity invalidation (#324, synthetic intercepted API)
        env:
          PYTHON: python
        run: node scripts/tasks-read-authority-browser.mjs
      - name: 管理员口令浏览器反例
        env:
          PYTHON: python
        run: node scripts/admin-token-browser.mjs
      - name: 全站登录门浏览器回归（enforce：登录页·沙箱自产台子资源/图片/内嵌·SPA 401 去登录·退出·next 防外跳）
        env:
          PYTHON: python
        run: node scripts/login-gate-browser.mjs
      - name: UI 外壳浏览器回归（#316 菜单分组；#317 页面骨架；#319 列表规则；#320 看板 12 列栅格·四类卡片·数据截至·驾驶舱旧布局吸附不丢卡不回写）
        env:
          PYTHON: python
        run: node scripts/sider-menu-browser.mjs
      - name: SOP 交付空间浏览器回归（#318：执行记录元数据·单次记录读授权由服务端判·定义不带正文·刷新不丢·附件带口令下载）
        env:
          PYTHON: python
        run: node scripts/sop-space-browser.mjs
      - name: 设计 token 出口（#321：/design/tokens@1.css 固定路径·SOP 执行页内联变量且不写死色值·与市场同色同字号·自产台示例全走变量）
        env:
          PYTHON: python
        run: node scripts/tokens-surface-smoke.mjs
      # E2E 组 21 的 a2a-smoke 用上游 verifyCard 当裁判：检出公开的 dsh-open-a2a-net（钉提交），A2A_CARD_SRC 指过去
      - uses: actions/checkout@v4
        with:
          repository: NelsonLongxiang/dsh-open-a2a-net
          ref: 9c0dfc012fd9c6001da4af0847682dc2700b154c
          path: dsh-open-a2a-net
      - name: 完整 E2E 跑器隔离回归（宿主 YGL_HOME 诱饵不透传）
        run: node scripts/e2e-full-run-isolation-smoke.mjs
      - name: Content full-index launch and revocation browser (fake Odoo, no production)
        env:
          PYTHON: python
        run: node scripts/content-index-browser.mjs
      - name: SOP read-only preview browser (intercepted origin; no TCP or production)
        env:
          PYTHON: python
        run: node scripts/sop-readonly-browser.mjs && node scripts/sop-field-browser.mjs --finish
      - name: SOP 执行页可访问性（#436：字段可访问名称·说明与错误关联·错误汇总·条件必填切换）
        env:
          PYTHON: python
        run: node scripts/sop-runner-a11y-browser.mjs
      - name: SOP run 引用已有文件与配额、文件清单字段（#437②①：逐条结果·同 SOP·源 run 读凭证·不占上传配额·执行页多选逐个上传）
        env:
          PYTHON: python
        run: node scripts/sop-run-file-refs-smoke.mjs && node scripts/sop-file-list-smoke.mjs
      - name: 完整 E2E 跑器收尾回归（自起 server 未确认退出不删 TMP）
        run: node scripts/e2e-full-run-cleanup-test.mjs
      - name: 宿主 YGL_HOME 诱饵（不可读目录，完整 E2E 两档都带着它跑）
        run: mkdir -p "$RUNNER_TEMP/decoy-ygl-home" && chmod 000 "$RUNNER_TEMP/decoy-ygl-home"
      - name: 完整 E2E（M1 双面：控制面开，隔离实例）
        env:
          PYTHON: python
          A2A_CARD_SRC: ${{ github.workspace }}/dsh-open-a2a-net/src/card.ts
          YGL_HOME: ${{ runner.temp }}/decoy-ygl-home
        run: node scripts/e2e-full-run.mjs
      - name: 完整 E2E（WM_CONTROL_PORT=0 控制面关闭）
        env:
          PYTHON: python
          A2A_CARD_SRC: ${{ github.workspace }}/dsh-open-a2a-net/src/card.ts
          YGL_HOME: ${{ runner.temp }}/decoy-ygl-home
        run: node scripts/e2e-full-run.mjs --control-off
  tsc-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit script data/library targets (#341, missing-target IO intercepted)
        run: node scripts/explicit-data-targets-test.mjs && node scripts/explicit-data-target-positive-test.mjs && node scripts/explicit-source-links-test.mjs && node scripts/owned-script-fixture-test.mjs && node scripts/owned-script-fixture-lan-test.mjs
      - name: Explicit script targets (#341, negative calls intercepted, loopback fixtures)
        env:
          PYTHON: python
        run: node scripts/explicit-script-targets-test.mjs
      - name: tsc (web)
        run: pnpm --filter web typecheck
      - name: server 语法核（esbuild）
        run: node scripts/check-server-syntax.mjs
      - name: Startup security self-probe (#326, loopback synthetic only)
        run: node scripts/startup-security-self-probe-test.mjs && node scripts/startup-security-self-probe-http-test.mjs && node scripts/startup-security-self-probe-upgrade-test.mjs
      - name: Tasks identity and project/run grant isolation (#324, synthetic only)
        run: node scripts/tasks-read-authority-http-test.mjs
      - name: Redis ready recovery and durable-generation rebound (#351, synthetic only)
        run: node scripts/redis-ready-state-test.mjs && node scripts/redis-ready-recovery-http-test.mjs && node scripts/redis-ready-fingerprint-mutation.mjs && node scripts/sop-redis-read-503-test.mjs
      - name: SOP checkpoint deadlines and active-list completeness (#337, #338; synthetic only)
        run: node scripts/sop-state-checkpoints-test.mjs && node scripts/sop-state-http-test.mjs && node scripts/sop-state-restart-test.mjs
      - name: SOP list privacy and upload-token rotation (#309, synthetic only)
        run: node scripts/sop-list-privacy-test.mjs && node scripts/sop-query-token-test.mjs && node scripts/sop-upload-token-rotation-test.mjs && node scripts/sop-list-privacy-http-test.mjs && node scripts/sop-run-read-auth-test.mjs
      - name: Verifier criterion65 portal call-chain mutations (synthetic snapshot only)
        run: node scripts/portal-call-chain-test.mjs && node scripts/verifier-masked-import-test.mjs
      - name: 统一待办 ygl-trees 项目上限与总预算（合成入口）
        run: node scripts/ygl-project-cap-smoke.mjs
      - name: Content admission and terminal surface (synthetic only)
        run: node scripts/content-access-test.mjs && node scripts/content-surface-test.mjs && node scripts/content-stream-revocation-test.mjs && node scripts/content-migration-test.mjs && node scripts/content-query-credentials-test.mjs && node scripts/content-static-test.mjs && node scripts/portal-observation-test.mjs
      - name: SOP read-only preview validation (no browser or production routing)
        run: node scripts/sop-field-rules-smoke.mjs && node scripts/sop-run-upgrade-smoke.mjs && node scripts/sop-field-finish-test.mjs && node scripts/sop-field-finish-router-test.mjs && node scripts/sop-field-upload-test.mjs && node scripts/sop-field-upload-router-test.mjs && node scripts/sop-field-save-test.mjs && node scripts/sop-field-router-test.mjs && node scripts/sop-field-channel-state-test.mjs && node scripts/sop-run-access-test.mjs && node scripts/sop-readonly-assembly-test.mjs && node scripts/sop-readonly-channel-test.mjs && node scripts/sop-readonly-state-test.mjs
      - name: Taskcenter B1 seed and intake publication
        run: node scripts/taskcenter-intake-smoke.mjs
      # OriginClaim 绑定形式：裁判是上游 verifyOriginClaim（钉在含 src/origin-claim.ts 的 master 提交），按关窗后的状态判
      - uses: actions/checkout@v4
        with:
          repository: NelsonLongxiang/dsh-open-a2a-net
          ref: cf4896164b5df2304fc5f5c7bb613cb865e924f6
          path: dsh-open-a2a-net
      - name: OriginClaim 绑定形式出站（#64 关窗后对端只认 Sig2：上游裁判·重放换路由/方法/主机皆拒·仅 v1 反例）
        env:
          A2A_ORIGIN_SRC: ${{ github.workspace }}/dsh-open-a2a-net/src/origin-claim.ts
        run: node scripts/origin-claim-bound-smoke.mjs
      - name: /a2a/direct 入站签名（WM_A2A_DIRECT_SIG accept/require/enforce·上游 signOriginClaim 签·篡改 body/方法/路径/过期/重放/身份不符/未登记/坏卡 401·取卡不跟随重定向·密钥轮换）
        env:
          A2A_ORIGIN_SRC: ${{ github.workspace }}/dsh-open-a2a-net/src/origin-claim.ts
        run: node scripts/a2a-direct-signature-smoke.mjs
      - name: Signed A2A direct and outbox reject redirects (#349, synthetic loopback only)
        run: node scripts/a2a-bound-redirect-test.mjs
      - name: 工作台事件层 v1（人提交→事件→团队接单：held/release·自动派发·退避重试/dead·决定端点·unrouted·表单 unverified·只增日志；对端上游裁判按关窗验）
        env:
          A2A_ORIGIN_SRC: ${{ github.workspace }}/dsh-open-a2a-net/src/origin-claim.ts
        run: node scripts/workbench-events-smoke.mjs
      - name: SSRF 默认关闭与启动告警（隔离实例）
        run: node scripts/r1-ssrf-smoke.mjs
      - name: R3 URL 登记准入（#258：精确许可·硬拒·全入口同核·import 全事务注错·审计日志）
        run: node scripts/r3-url-allowlist-smoke.mjs
      - name: 来源收敛（自产台/SOP 台只接受 GitHub 仓库 main·直接发布 410·sync 记 commit·替身仓库）
        run: node scripts/github-source-smoke.mjs
      - name: 导入导出（独立实例：replace 语义·内部路径行·掩码整批拒）
        run: node scripts/import-smoke.mjs
      - name: MCP 网关缺省开（#284·未设/空/on 匿名 401·off 告警·坏值拒启）
        run: node scripts/gateway-default-smoke.mjs && node scripts/gateway-smoke.mjs
      - name: 全站登录门（WM_LOGIN_GATE：enforce 匿名 302/401·口令登录 cookie·限频退避·next 防外跳·台令牌/查看凭证·/mcp 网关·本机命令行·Odoo 替身·off 不变·坏值拒启）
        run: node scripts/login-gate-smoke.mjs
      - name: 登录门上线演练（enforce 隔离实例：MCP/健康/A2A/SOP/台与门户/生命周期/运维/回滚逐类真实请求）
        run: node scripts/login-gate-rollout-check.mjs
      - name: MCP 权限可见与自助申请（access_info 全目录·access_request 去重限频·管理员批准并集/驳回不动 grants/吊销不能批·app_data_submit 与 REST 同核契约校验·匿名 401）
        run: node scripts/mcp-access-smoke.mjs
      - name: MCP 内嵌 REST / OpenAPI（文件：99MB 流式上传 sha256 一致·Range/ETag 下载·415·403/401；资源：列文件/读数据/SOP 附件；工具映射与 /mcp 同链·审计 channel=rest·匿名 5MB 413）
        run: node scripts/mcp-rest-smoke.mjs && node scripts/mcp-rest-smoke.mjs --login-gate
      - name: 工作台变量与常量（#336：三类台隔离·权限·常量保护·并发 409·重启恢复·MCP；常量谁写的谁维护）
        run: node scripts/workbench-vars-smoke.mjs && node scripts/workbench-const-owner-smoke.mjs
      - name: MCP design_standard 只读读取设计标准（模块+实例·网关开关两态）
        run: node scripts/design-standard-smoke.mjs
      - name: design token 管线（#315：产物与 DESIGN.md 同步·引用解析·主题与侧栏不写死色值）
        run: node scripts/design-tokens-smoke.mjs
      - name: SOP 定义只读接口（#318：published 公开·draft/deprecated 仅管理员·不带步骤正文·冷版本 404）
        run: node scripts/sop-definition-smoke.mjs
      - name: 自产台/SOP 台卡片健康核实台本身（不存在或未上架记 down）与 sop_run_get 时间字段
        run: node scripts/self-hosted-health-smoke.mjs
      - name: LayerFS 存活/就绪与删台兜底冒烟
        run: node scripts/layerfs-health-delete-smoke.mjs
      - name: sop_run_list 翻页冒烟（limit/offset·同时间戳按 id 排定）
        run: node scripts/sop-run-list-page-smoke.mjs
      - name: 技能迁移 LayerFS 冒烟（0 字节文件照常迁移·读回摘要一致才记 commit_id·摘要不符留档）
        run: node scripts/skill-migrate-layerfs-smoke.mjs
      - name: 技能发布按字节冒烟（base64 二进制往返：快照/导出/钉装校验逐字节一致·同内容 409·影子 skipped·MCP skill_publish 上传/发版/更新）
        run: node scripts/skill-binary-publish-smoke.mjs
      - name: 技能回滚冒烟（回滚=移当前版本指针不新增版本·不撞同指纹唯一索引·回滚后缺省取装/导出/安装计划/校验=目标版本·二进制逐字节一致·MCP 变更申请批准同一执行体·发新版恢复跟随最新·预置孤儿版本目录挪进 .orphans 不混写）
        run: node scripts/skill-rollback-smoke.mjs
      - name: 驾驶舱布局吸附单测（#320：宽度只取 3/4/6/12·x 越界收回·不丢面板·读时迁移不回写）
        run: node scripts/cockpit-layout-unit.mjs
      - name: 待属主看板（作者核验：config.owner 只认属主本人·事项只认登记身份·答复只认属主·冒名点名不采信·只授三个工具）
        run: node scripts/owner-pending-unit.mjs && node scripts/owner-pending-board-smoke.mjs
      - name: 凭据库（融合 dsh-vault：读写要口令·业务面 403·摘要无明文·坏 JSON 不进日志·写锁/重开/闲置上锁/限流）
        run: node scripts/vault-concurrency-test.mjs && node scripts/vault-smoke.mjs
      - name: F5 env-face 判定回归（不启动 Docker）
        run: node scripts/security-env-face-test.mjs
      - name: 扩展挂载点冒烟（WM_EXTENSIONS_DIR：不设不加载·目录/模块/register 出错拒绝启动·路由/待办来源/业务写面）
        run: node scripts/extensions-smoke.mjs
      - name: Odoo 弹窗登录链接单测（return 换成当前页·只回 path）
        run: node scripts/odoo-login-href-unit.mjs
      - name: Odoo 浏览器登录地址策略（WM_ODOO_BROWSER_URL）
        run: node scripts/odoo-browser-origin-test.mjs
      - name: 来源 IP 单测（WM_TRUSTED_PROXIES：可信反代才认 X-Real-IP/XFF·伪造不生效·非法项拒绝启动）
        run: node scripts/client-ip-unit.mjs
      - name: 日志不泄露上游会话 + 登录中继安全头（Set-Cookie 只记名·查询串不进日志·XFO/nosniff/frame-ancestors）
        run: node scripts/log-secret-relay-headers-smoke.mjs
      - name: 管理员口令止血单测（#292 M4：pagehide 抹口令·变更广播）
        run: node scripts/admin-token-guard-unit.mjs
      - name: 门户剥 Service-Worker-Allowed 冒烟（#292 M5）
        run: node scripts/portal-sw-header-smoke.mjs
      - name: 门户台地址带路径的跳转映射冒烟（base 外跳转拦成 502、base 内去 base）
        run: node scripts/portal-base-redirect-smoke.mjs
      - name: 控制面冒烟（#292 M1：浏览器管理写只认控制面·本机 CLI 保留·反代按远程·控制面围栏）
        run: node scripts/control-surface-smoke.mjs
      - name: 远程写总门大小写一致性（/API/… 不能绕过口令）
        run: node scripts/api-gate-case-smoke.mjs
      - name: 安全对抗例组（PASS / SKIP / NEEDS-MATERIAL 分列）
        run: node scripts/security-adversarial-smoke.mjs
      - name: 留存 F5 原始证据与覆盖摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-security-evidence
          path: |
            tmp/security-adversarial-summary.json
            tmp/f5-env-face-*.json
          if-no-files-found: warn
      - name: server 冷启动探针（防重启即死）
        run: |
          PORT=19999 DATA_DIR=${{ runner.temp }}/ci-data ADMIN_TOKEN=ci timeout 20 node --disable-warning=ExperimentalWarning server/src/index.ts &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:19999/api/health >/dev/null && echo "health ok" && exit 0
            sleep 1
          done
          echo "server failed to boot" >&2; exit 1
