name: CI
on:
  pull_request:
    branches: [main]
# 同一个 PR 推了新提交，旧提交上还在跑的那一轮就取消：旧头的结果没人用，却占着并发名额。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  odoo-operator-synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic Odoo operator guards (no credentials or network)
        shell: pwsh
        run: ./scripts/ops/odoo-readonly-preflight-test.ps1
  browser-security:
    # #292 M4 真实浏览器反例：有口令不嵌 /go/、跳出清口令、登录弹窗不复制口令且无 opener（bfcache 未命中记 SKIP）
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: '1.57.0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      # 装环境和跑测试分开：装环境只依赖外网（PyPI、Playwright 的浏览器下载、apt 软件源），带重试与缓存；
      # 失败时标「装环境失败」。浏览器版本由 Playwright 版本决定，缓存键带上它，升级就换键。
      # 缓存先取后存：存放在装环境之后单独一步，后面的测试红了也照样存
      - name: 装环境：取 Playwright 浏览器缓存
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ env.ImageOS }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: 装环境：取系统依赖的 apt 包缓存
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: 装环境：Playwright（Python）+ Chromium 与系统依赖
        id: browser-env
        timeout-minutes: 12
        run: |
          set -euo pipefail
          fail() { echo "::error title=装环境失败（不是测试失败）::$1"; exit 1; }
          # retry 次数 命令…：间隔 15、30、60 秒
          retry() {
            local max=$1 n=1 wait=15; shift
            until "$@"; do
              if [ "$n" -ge "$max" ]; then return 1; fi
              echo "::warning title=装环境重试::第 $n 次没成（$(echo "$*" | cut -c1-80)），${wait} 秒后重试"
              sleep "$wait"; n=$((n + 1)); wait=$((wait * 2))
            done
          }
          retry 4 python -m pip install --retries 5 "playwright==${PLAYWRIGHT_VERSION}" \
            || fail "pip 装 playwright==${PLAYWRIGHT_VERSION} 四次都没成"
          # 命中缓存时浏览器已经在 ~/.cache/ms-playwright 里，install 认出来就不下载
          retry 4 python -m playwright install chromium || fail "下载 Chromium 四次都没成"

          # 两个都要能起：无头壳（Python 测试默认用它）和完整的 Chromium（CHROME_BIN 指的就是它）
          probe() {
            python -c 'from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for channel in (None, "chromium"):
                  b = p.chromium.launch(channel=channel) if channel else p.chromium.launch()
                  print("能起：", channel or "chromium-headless-shell", b.version)
                  b.close()'
          }
          # 先不碰 apt：镜像里的系统库够浏览器起来就到此为止
          if probe; then
            echo "Chromium 在镜像自带的系统库上能起来，不装系统依赖，不碰 apt"
            exit 0
          fi

          echo "Chromium 起不来，补系统依赖。清单取 Playwright 自己的（install-deps --dry-run），只装镜像里没有的"
          pkgs=$(python -m playwright install-deps --dry-run chromium | sed -nE 's/.*--no-install-recommends (.*)$/\1/p' | tr -d '"') || pkgs=""
          [ -n "$pkgs" ] || fail "取不到 Playwright 的系统依赖清单，Chromium 又起不来"
          missing=""
          for p in $pkgs; do
            dpkg-query -W -f='${db:Status-Status}' "$p" 2>/dev/null | grep -qx installed || missing="$missing $p"
          done
          echo "镜像里缺：${missing:-（都有，但还是起不来）}"
          debs="$HOME/.cache/playwright-apt"
          mkdir -p "$debs/partial"
          # 每次 apt 最多 4 分钟；DNS 解析不了时不要每个源都等满
          aptget() { sudo timeout 240 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
                    -o Dir::Cache::archives="$debs" -o APT::Keep-Downloaded-Packages=true "$@"; }
          install_missing() { aptget update && aptget install -y --no-install-recommends $missing; }
          # 换源：GitHub 的镜像经 mirror+file 列表取包，归档和安全更新都先走同一个源；两类都换成 $1
          use_mirror() {
            echo "换源到 $1"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] || continue
              sudo sed -i -E "s#mirror\+file:[^ ]*#$1#g; s#https?://[A-Za-z0-9.-]*ubuntu\.com/ubuntu/?#$1#g" "$f"
            done
          }
          if [ -n "$missing" ]; then
            if compgen -G "$debs/*.deb" >/dev/null && aptget install -y --no-install-recommends --no-download $missing; then
              echo "用缓存里的 apt 包装好了（没联网）"
            elif retry 2 install_missing; then
              echo "从镜像默认的源装好了"
            else
              ok=""
              for m in http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/; do
                use_mirror "$m"
                if retry 2 install_missing; then ok=1; echo "从 $m 装好了"; break; fi
              done
              [ -n "$ok" ] || fail "默认源和两个备用源都装不上：$missing"
            fi
            sudo chown -R "$(id -u):$(id -g)" "$debs"
          fi
          probe || fail "补了系统依赖，Chromium 还是起不来"
      - name: 装环境：存 Playwright 浏览器缓存
        if: steps.browser-env.outcome == 'success' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
      - name: 装环境：存系统依赖的 apt 包缓存
        if: steps.browser-env.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - run: pnpm --filter web build
      - name: Odoo same-host login and logout (synthetic HTTP and Chromium)
        run: |
          export CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          node scripts/odoo-same-host-login-smoke.mjs
          node scripts/odoo-browser-origin-http-test.mjs
          node scripts/odoo-logout-smoke.mjs
          node scripts/log-secret-relay-headers-smoke.mjs
      - name: SOP metadata-only history UI (#309, synthetic intercepted API)
        env:
          PYTHON: python
        run: node scripts/sop-list-privacy-browser.mjs
      - name: Review task action and human approval UI (synthetic intercepted API)
        run: python scripts/review-gate-browser.py
      - name: Tasks viewer identity invalidation (#324, synthetic intercepted API)
        env:
          PYTHON: python
        run: node scripts/tasks-read-authority-browser.mjs
      - name: 管理员口令浏览器反例
        env:
          PYTHON: python
        run: node scripts/admin-token-browser.mjs
      - name: 全站登录门浏览器回归（enforce：登录页·沙箱自产台子资源/图片/内嵌·SPA 401 去登录·退出·next 防外跳）
        env:
          PYTHON: python
        run: node scripts/login-gate-browser.mjs
      - name: UI 外壳浏览器回归（#316 菜单分组；#317 页面骨架；#319 列表规则；#320 看板 12 列栅格·四类卡片·数据截至·驾驶舱旧布局吸附不丢卡不回写）
        env:
          PYTHON: python
        run: node scripts/sider-menu-browser.mjs
      - name: 「等你拍板」三处同数（侧栏角标 · 总结句 · 卡片区件数；只数轮到你且能当场办的；数据走接口造）
        env:
          PYTHON: python
        run: node scripts/home-count-browser.mjs
      - name: 身份服务连不上（#639 的 502 identity_unavailable——整页提示·角标和等你拍板写暂时取不到·不跳登录页·自动重试后提示消失·别的 502 和 401 不算）
        env:
          PYTHON: python
        run: node scripts/identity-down-browser.mjs
      - name: SOP 交付空间浏览器回归（#318：执行记录元数据·单次记录读授权由服务端判·定义不带正文·刷新不丢·附件带口令下载）
        env:
          PYTHON: python
        run: node scripts/sop-space-browser.mjs
      - name: 设计 token 出口（#321：/design/tokens@1.css 固定路径·SOP 执行页内联变量且不写死色值·与市场同色同字号·自产台示例全走变量）
        env:
          PYTHON: python
        run: node scripts/tokens-surface-smoke.mjs
      # E2E 组 21 的 a2a-smoke 用上游 verifyCard 当裁判：检出公开的 dsh-open-a2a-net（钉提交），A2A_CARD_SRC 指过去
      - uses: actions/checkout@v4
        with:
          repository: NelsonLongxiang/dsh-open-a2a-net
          ref: 9c0dfc012fd9c6001da4af0847682dc2700b154c
          path: dsh-open-a2a-net
      - name: 完整 E2E 跑器隔离回归（宿主 YGL_HOME 诱饵不透传）
        run: node scripts/e2e-full-run-isolation-smoke.mjs
      - name: Content full-index launch and revocation browser (fake Odoo, no production)
        env:
          PYTHON: python
        run: node scripts/content-index-browser.mjs
      - name: SOP read-only preview browser (intercepted origin; no TCP or production)
        env:
          PYTHON: python
        run: node scripts/sop-readonly-browser.mjs && node scripts/sop-field-browser.mjs --finish
      - name: SOP 执行页可访问性（#436：字段可访问名称·说明与错误关联·错误汇总·条件必填切换）
        env:
          PYTHON: python
        run: node scripts/sop-runner-a11y-browser.mjs
      - name: SOP 字段间数值关系（#471：data-check 执行页与服务端逐字同结论·依赖字段重算·错误汇总）
        env:
          PYTHON: python
        run: node scripts/sop-field-check-browser.mjs
      - name: SOP run 引用已有文件与配额、文件清单字段（#437②①：逐条结果·同 SOP·源 run 读凭证·不占上传配额·执行页多选逐个上传）
        env:
          PYTHON: python
        run: node scripts/sop-run-file-refs-smoke.mjs && node scripts/sop-file-list-smoke.mjs
      - name: 完整 E2E 跑器收尾回归（自起 server 未确认退出不删 TMP）
        run: node scripts/e2e-full-run-cleanup-test.mjs
      - name: 宿主 YGL_HOME 诱饵（不可读目录，完整 E2E 两档都带着它跑）
        run: mkdir -p "$RUNNER_TEMP/decoy-ygl-home" && chmod 000 "$RUNNER_TEMP/decoy-ygl-home"
      - name: 完整 E2E（M1 双面：控制面开，隔离实例）
        env:
          PYTHON: python
          A2A_CARD_SRC: ${{ github.workspace }}/dsh-open-a2a-net/src/card.ts
          YGL_HOME: ${{ runner.temp }}/decoy-ygl-home
        run: node scripts/e2e-full-run.mjs
      - name: 完整 E2E（WM_CONTROL_PORT=0 控制面关闭）
        env:
          PYTHON: python
          A2A_CARD_SRC: ${{ github.workspace }}/dsh-open-a2a-net/src/card.ts
          YGL_HOME: ${{ runner.temp }}/decoy-ygl-home
        run: node scripts/e2e-full-run.mjs --control-off
      - name: 失败归因
        if: failure()
        run: |
          if [ "${{ steps.browser-env.outcome }}" = "success" ]; then
            echo "::error title=测试失败::浏览器环境装好了（装环境一步成功），失败在后面的测试步骤里，看标红的那一步"
          else
            echo "::error title=装环境失败（不是测试失败）::浏览器环境没装好（装环境一步：${{ steps.browser-env.outcome }}），后面的测试没跑；多半是外网原因，隔一会儿重跑"
          fi
  # 身份接缝与主体：从 tsc-and-syntax 拆出来并行跑（这一步最长，单独一个 job 不拖别的检查）。
  # job 里再并行一层：变异测试（最慢）和单测、对抗组同时跑；单测与对抗组的输出先进日志，跑完再打出来。
  identity-seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 身份接缝与主体（契约单测·主体服务单测·主体标识规范化（NFKC_Casefold）全部码位对照 Unicode 属性、成批过主体服务·飞书登录与市场会话对抗组（本机假飞书：state 伪造与重放、next 外跳、换令牌失败、用户标识缺失或被篡改、停用注销过期即失效）·离职即时失效对抗组（通讯录事件验签与重放、对账补漏）·假提供方对抗组：缺省/登录门/登录中继/中继加登录门四个实例上的拒绝例与合法对照，停用一个主体各入口立即不认、恢复立即照常·部门读写（登录的人读、管理员写、dept:<部门标识> 只认部门表里有的）·夹具只在测试环境可用·变异测试逐个改坏必须变红；不访问任何外部系统）
        run: |
          ( node scripts/identity-contract-test.mjs && node scripts/principal-service-test.mjs && node scripts/principal-fold-test.mjs && node scripts/identity-seam-smoke.mjs && node scripts/identity-source-timeout-test.mjs && node scripts/feishu-login-smoke.mjs && node scripts/feishu-offboard-smoke.mjs && node scripts/export-reveal-smoke.mjs && node scripts/grants-smoke.mjs && node scripts/departments-smoke.mjs && node scripts/access-smoke.mjs && node scripts/red-lines-test.mjs && node scripts/teams-smoke.mjs && node scripts/judgment-compare-smoke.mjs && node scripts/judgment-compare-zero-test.mjs && node scripts/judgment-compare-sweep-test.mjs && node scripts/judgment-enforce-test.mjs && node scripts/role-presets-test.mjs && node scripts/custom-roles-smoke.mjs ) > identity-suites.log 2>&1 &
          suites=$!
          set +e
          node scripts/identity-seam-mutation.mjs --jobs 2
          mutation=$?
          wait "$suites"
          rc=$?
          echo "::group::单测与对抗组的输出"
          cat identity-suites.log
          echo "::endgroup::"
          echo "单测与对抗组退出码 $rc；变异测试退出码 $mutation"
          [ "$rc" -eq 0 ] && [ "$mutation" -eq 0 ]
  upgrade-smoke:
    # 线上发布分支的库换成这份代码启动两次（自检、只加不改、幂等、回填），再退回发布分支能读能写；全程合成数据、只听回环
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 升级冒烟（基线 origin/release/prod-hotfix-1 → 本 PR）
        run: node scripts/upgrade-smoke.mjs
  tsc-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit script data/library targets (#341, missing-target IO intercepted)
        run: node scripts/explicit-data-targets-test.mjs && node scripts/explicit-data-target-positive-test.mjs && node scripts/explicit-source-links-test.mjs && node scripts/owned-script-fixture-test.mjs && node scripts/owned-script-fixture-lan-test.mjs
      - name: Explicit script targets (#341, negative calls intercepted, loopback fixtures)
        env:
          PYTHON: python
        run: node scripts/explicit-script-targets-test.mjs
      - name: tsc (web)
        run: pnpm --filter web typecheck
      - name: server 语法核（esbuild）
        run: node scripts/check-server-syntax.mjs
      - name: 路线体检（结构数字对照 tech-route.json 的基线：预算与红线超了就失败，体检表写进摘要页；自检先红后绿）
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/tech-route-check.mjs --selftest
          node scripts/surface-snapshot.mjs --selftest
          node scripts/tech-route-check.mjs --strict
          node scripts/privacy-gate.mjs --selftest
      - name: 台库冒烟（数据视图：数据集与改列·四种写入的校验、幂等、上限·快照与退回·查询描述与注入形态·视图描述的核对、版本、并发保存、回退·排队、隔离、标识不逃出目录）
        run: node scripts/bench-store-smoke.mjs && node --disable-warning=ExperimentalWarning scripts/skill-data-views-examples-test.mjs
      - name: 库的写锁等待有上限（市场主库、判定比对库：别的进程短暂持写锁时等得到、一直不放时 5 秒前后报错不无限等·台库按这一次的时限取小）
        run: node scripts/db-busy-timeout-test.mjs
      - name: 事项服务单测（阶段八 8a：第三节状态表含补定的原地行逐行正例、表外迁移逐个反例·只记录的答复与回执·终态之后只收晚到回执·同一条事实只记一次·事项日志改写删除在库这一层被拒；8b：事件日志→事项的映射·正放打乱重复终态相同·监听器漏一次回填补上·未验证来源不推进·回填两遍逐行相同·来源回滚事项也没有）
        run: node scripts/work-item-service-test.mjs && node scripts/work-item-facts-test.mjs && node scripts/work-item-migration-test.mjs
      - name: 事项回填不挡启动（后台分批、每片让出事件循环；启动到能应答不随事件数增长·中途被杀重启接着跑、终态同一次跑完·重跑逐行相同、版本没变跳过·回填期间进来的事实不丢不重复）
        run: node scripts/work-item-backfill-test.mjs
      - name: 建事项时的标题和派给（任务中心的取任务标题、取不到退到来源坐标·派给取投递的目标团队·存量只补自动的缺省值、改过的不动、重复跑不改、启动就补不随回填版本走·不写事项日志）
        run: node scripts/work-item-title-team-test.mjs
      - name: 事项的交给方式（建的时候记下交给方式、等谁过目、指名的 seatId·不认得的取值兜底成交给团队·旧库补列、存量是缺省值）
        run: node scripts/work-item-handoff-test.mjs
      - name: 事项上看得到的人和列表的视角（放宽访问的对抗：建立人、管理层看得到，别人 404·管理层按拍板类动作认：只授普通员工或系统管理员的看不到别人的、只授管理层的看得到·列表里每一条详情都是 200·视角可用性和件数·不可用的视角 403·「关注」的验收条目和详情同一处判断）
        run: node scripts/work-item-views-test.mjs
      - name: 成员的主人、负责人和 seats / team 视角（放宽访问的对抗：席位按完整的键，别的节点上 seat_id 相同、名字只多一个字的团队里句柄相同的都不算·换主人那一秒左闭右开、列表和详情同一个口径·负责人看得到本团队的、别的团队的 404·列表里每一条详情都是 200·「关注」负责人看得到本团队的待验收）
        run: node scripts/work-item-views-team-test.mjs
