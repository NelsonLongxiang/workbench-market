<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自产台示例 · 设计 token</title>
<!-- 引入市场提供的设计 token（主版本固定路径；名字稳定、值可变）。经市场门户 /apps/<slug>/ 或 /go/<id>/ 打开时同源可用。 -->
<link rel="stylesheet" href="/design/tokens@1.css">
<style>
  /* 正文、状态、面与线只用 --wm-* 变量；不抄色值。自产台可以另加自己的品牌色，但不替换这些。 */
  body { margin: 0; font-family: var(--wm-font-sans); font-size: var(--wm-font-size-body); line-height: var(--wm-line-height-body); color: var(--wm-color-text); background: var(--wm-color-page); }
  main { max-width: 720px; margin: var(--wm-space-6) auto; padding: 0 var(--wm-space-4); }
  .card { background: var(--wm-color-surface); border: 1px solid var(--wm-color-border); border-radius: var(--wm-radius-lg); padding: var(--wm-space-4); box-shadow: var(--wm-shadow-1); }
  h1 { font-size: var(--wm-font-size-title); line-height: var(--wm-line-height-title); font-weight: var(--wm-font-weight-title); margin: 0 0 var(--wm-space-2); }
  .hint { color: var(--wm-color-text-secondary); }
  .ok { background: var(--wm-color-success-bg); color: var(--wm-color-success-text); padding: var(--wm-space-1) var(--wm-space-2); border-radius: var(--wm-radius-sm); }
  .warn { background: var(--wm-color-warning-bg); color: var(--wm-color-warning-text); padding: var(--wm-space-1) var(--wm-space-2); border-radius: var(--wm-radius-sm); }
  .err { background: var(--wm-color-danger-bg); color: var(--wm-color-danger-text); padding: var(--wm-space-1) var(--wm-space-2); border-radius: var(--wm-radius-sm); }
  button { font: inherit; padding: var(--wm-space-1) var(--wm-space-4); border-radius: var(--wm-radius-md); border: 1px solid var(--wm-color-primary); background: var(--wm-color-primary); color: var(--wm-color-on-primary); cursor: pointer; }
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>自产台示例</h1>
    <p class="hint">这页只用市场的 --wm-* 变量，在门户里打开与市场观感一致。</p>
    <p><span class="ok">已完成</span> <span class="warn">待处理</span> <span class="err">失败</span></p>
    <button type="button">主操作</button>
  </section>
</main>
</body>
</html>
