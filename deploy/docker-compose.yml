# #147 部署批：基文件默认回环绑定（P0-4）·layerfs 走 profiles 隔离（P1-1）·token 必设（P1-2）
# #215：先 build-layerfs.sh SOURCE NEW_CONTEXT --prepare-only，再标准 Compose build。
services:
  market:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.market
    ports:
      - "127.0.0.1:9800:9800"   # 安全默认：仅宿主回环。对外暴露请在覆盖层用 !override 改写
    environment:
      LAYERFS_SERVICE_URL: ${LAYERFS_SERVICE_URL:-}
      LAYERFS_SERVICE_TOKEN: ${LAYERFS_SERVICE_TOKEN:-}
      DATA_DIR: /data
    volumes:
      - market-data:/data
    # 网络模型（#147 P0-3）：host 模式推荐——容器内探本机服务零配置
    # #292 M1：进程同时监听 WM_CONTROL_PORT（缺省 PORT+1=9801，管理控制面）；host 模式下 ports 不生效，bridge 模式需另映射 9801。
    #          建议防火墙只对管理员网段开放 9801。
    network_mode: host
    healthcheck: &hc
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9800/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  layerfs:
    profiles: ["layerfs"]
    image: ${LAYERFS_IMAGE:-wm-x-layerfs:test}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.layerfs
      additional_contexts:
        layerfs: ${LAYERFS_CONTEXT:?先用 deploy/build-layerfs.sh 准备固定钉点受控 context，再设置 LAYERFS_CONTEXT}
    environment:
      # P1-2：未设即 compose 级拒启（不再静默默认 change-me）
      LAYERFS_SERVICE_TOKEN: ${LAYERFS_SERVICE_TOKEN:?LAYERFS_SERVICE_TOKEN 必设（不可用 change-me）}
      LAYERFS_NATIVE: /usr/local/lib/layerfs.node   # #215 X6 八障：SDK addonPath 走 env
      LAYERFS_HOME: /var/lib/layerfs/home   # #215 十五障②：locator 面（勿设 /layerfs-store 陈值）
      LAYERFS_STORE_PATH: /var/lib/layerfs/home/global/store.sqlite   # #215 十八障：镜像级同值
      LAYERFS_STORE_ROOT: /var/lib/layerfs
    ports:
      - "8067:8067"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # 注意：挂 socket=服务容器等同宿主 root（文档已标注）
      - /var/lib/docker/volumes:/var/lib/docker/volumes:rw
      - layerfs-store:/var/lib/layerfs

  layerfs-p0:              # #215：替身参考镜像转测试专用 profile（契约面对照）
    profiles: ["layerfs-p0"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.layerfs-p0
    environment:
      LAYERFS_SERVICE_PORT: 8067
    ports:
      - "8067:8067"

volumes:
  market-data:
  layerfs-store:
