# LayerFS is mandatory for the standard stack. The service retains the frozen #94 volume lifecycle
# and therefore has host-root-equivalent Docker socket access; market itself never gets that access.
# LayerFS is never published; the control surface is opt-in via docker-compose.control.yml.
# Base stack publishes only the business surface; the opt-in override binds control to loopback.
# Prepare a pinned source context with deploy/build-layerfs.sh before Compose config/build.
services:
  market:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.market
    environment:
      LAYERFS_SERVICE_URL: http://layerfs:8067
      LAYERFS_SERVICE_TOKEN_FILE: /run/secrets/layerfs_service_token
      DATA_DIR: /data
    ports:
      - "127.0.0.1:9800:9800"
    volumes:
      - market-data:/data
    secrets:
      - layerfs_service_token
    networks:
      - default
      - layerfs-private
    depends_on:
      layerfs:
        condition: service_healthy
    healthcheck: &hc
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9800/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  layerfs:
    image: ${LAYERFS_IMAGE:-wm-x-layerfs:test}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.layerfs
      additional_contexts:
        layerfs: ${LAYERFS_CONTEXT:?先用 deploy/build-layerfs.sh 准备固定钉点受控 context，再设置 LAYERFS_CONTEXT}
    environment:
      LAYERFS_SERVICE_HOST: 0.0.0.0
      LAYERFS_SERVICE_PORT: 8067
      LAYERFS_SERVICE_TOKEN_FILE: /run/secrets/layerfs_service_token
      LAYERFS_NATIVE: /usr/local/lib/layerfs.node
      LAYERFS_HOME: /var/lib/layerfs/home
      LAYERFS_STORE_PATH: /var/lib/layerfs/home/global/store.sqlite
      LAYERFS_STORE_ROOT: /var/lib/layerfs
    networks:
      - layerfs-private
    restart: unless-stopped
    secrets:
      - layerfs_service_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # frozen LayerFS sandbox/volume lifecycle; host-root-equivalent privilege
      - layerfs-store:/var/lib/layerfs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8067/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  layerfs-p0:              # #215：替身参考镜像转测试专用 profile（契约面对照）
    profiles: ["layerfs-p0"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.layerfs-p0
    environment:
      LAYERFS_SERVICE_PORT: 8067
    ports:
      - "18067:8067" # substitute test profile isolated from real LayerFS host port

networks:
  layerfs-private:
    internal: true

secrets:
  layerfs_service_token:
    file: ${LAYERFS_TOKEN_FILE:?Provide a strong token file outside the repository}

volumes:
  market-data:
  layerfs-store:
